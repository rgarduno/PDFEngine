name: PDFEngine CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust:
    name: Rust Quality & Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rustfmt Check
        run: cargo fmt --check

      - name: Clippy Linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Core & Integration Tests
        run: cargo test -p pdf-engine-core

  python-build:
    name: Maturin Extension Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Maturin
        run: pip install maturin

      - name: Build Python Extension Wheel
        run: maturin build --manifest-path crates/pdf-engine-python/Cargo.toml
