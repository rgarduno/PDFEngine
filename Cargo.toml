[workspace]
members = [
    "crates/pdf-engine-core",
    "crates/pdf-engine-python",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["PDFEngine Contributors"]
license = "MIT"
repository = "https://github.com/rgarduno/PDFEngine"

[workspace.dependencies]
thiserror = "2.0"
flate2 = "1.0"
log = "0.4"
pyo3 = { version = "0.23", features = ["extension-module"] }
