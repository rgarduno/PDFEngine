[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pdf_engine"
version = "0.1.0"
description = "High-performance ISO 32000 PDF parsing, layout reconstruction, and lossless surgical editing engine"
authors = [{ name = "PDFEngine Contributors" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.maturin]
manifest-path = "crates/pdf-engine-python/Cargo.toml"
module-name = "pdf_engine"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

